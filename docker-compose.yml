#        soft: -1
#        hard: -1
#      nofile:
#        soft: 65536 # maximum number of open files for the OpenSearch user, set to at least 65536 on modern systems
#        hard: 65536

  elasticsearch7:
    container_name: elasticsearch7
    build:
      dockerfile: Dockerfile
      context: elasticsearch7
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - "discovery.type=single-node"
      - cluster.name=docker-cluster79
      - node.name=node-79
      - "ES_JAVA_OPTS=-Xms4g -Xmx4g"
      - bootstrap.memory_lock=true
      - allow_root=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
    restart: unless-stopped
    networks:
      - longnt

  varnish:
    image: varnish:6.0
    container_name: varnish
    build:
      context: varnish
    environment:
     - VARNISH_STORAGE_AMOUNT=2G
     - VARNISH_TRANSIENT_STORAGE_AMOUNT=2G
     - VARNISH_RESP_HDR_LEN=65536
     - VARNISH_RESP_SIZE=98304
    ports:
      - "6081:6081"
      - "6082:6082"
    volumes:
     - ./varnish/config/default.vcl:/etc/varnish/default.vcl
    command: >
      varnishd
        -F
        -a :6081
        -T localhost:6082
        -f /etc/varnish/default.vcl
        -s malloc,256m
    ulimits:
     memlock:
       soft: -1
       hard: -1
     nofile:
       soft: 65536
       hard: 65536
    restart: unless-stopped
    depends_on:
      - nginx
    networks:
      - longnt

  redis:
    image: redis:7.2
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - longnt

  mailhog:
    container_name: mailhog
    image: mailhog/mailhog
    ports:
      - 1025:1025 # smtp server
      - 8025:8025 # web ui
    networks:
      - longnt

networks:
  longnt:
    driver: bridge