  varnish:
    image: varnish:6.0
    container_name: varnish
    environment:
     - VARNISH_STORAGE_AMOUNT=2G
     - VARNISH_TRANSIENT_STORAGE_AMOUNT=2G
     - VARNISH_RESP_HDR_LEN=65536
     - VARNISH_RESP_SIZE=98304
    ports:
      - "6081:6081"
      - "6082:6082"
    volumes:
     - ./varnish/config/default.vcl:/etc/varnish/default.vcl
    command: >
      varnishd
        -F
        -a :6081
        -T localhost:6082
        -f /etc/varnish/default.vcl
        -s malloc,256m
        -p http_req_hdr_len=64k
        -p http_resp_hdr_len=64k
        -p http_max_hdr=128
    ulimits:
     memlock:
       soft: -1
       hard: -1
     nofile:
       soft: 65536
       hard: 65536
    restart: unless-stopped
    depends_on:
      - nginx
    networks:
      - longnt

