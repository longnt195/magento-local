  valkey:
    image: valkey/valkey:8
    container_name: valkey
    ports:
      - "6379:6379"
    volumes:
      - ./valkey/data:/data
    restart: unless-stopped
    command: ["valkey-server", "--save", "900", "1", "--loglevel", "notice", "--appendonly", "yes"]
    networks:
      - longnt

  mailhog:
    container_name: mailhog
    image: mailhog/mailhog
    ports:
      - 1025:1025 # smtp server
      - 8025:8025 # web ui
    networks:
      - longnt

networks:
  longnt:
    driver: bridge