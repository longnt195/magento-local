  mariadb:
    container_name: mariadb
    image: mariadb:10.6
    shm_size: 2gb
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./mariadb/db:/db:delegated
      - ./mariadb/conf:/etc/mysql/mariadb.conf.d:delegated
    restart: unless-stopped
    command: mysqld --sql_mode="" --innodb_ft_result_cache_limit=8000000000 --innodb_buffer_pool_size=5568435456 --max_allowed_packet=200000000 --innodb_strict_mode="OFF" --innodb_log_file_size=2503316480 --character-set-server=utf8 --collation-server=utf8_general_ci --innodb-flush-log-at-trx-commit=2 --optimizer_switch='rowid_filter=off' --optimizer_use_condition_selectivity=1
    networks:
      - longnt

