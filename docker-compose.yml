services:
  tls:
    container_name: tls
    image: nginx:1.22
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./tls/nginx.conf:/etc/nginx/nginx.conf
      - ./tls/ssl:/etc/ssl
    restart: unless-stopped
    depends_on:
      - varnish
    networks:
      - longnt

  nginx:
    container_name: nginx
    image: nginx:1.22
    ports:
      - 8080:8080
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/sites:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/ssl
      - ./projects81:/var/www/projects81:delegated
      - ./projects82:/var/www/projects82:delegated
    restart: unless-stopped
    networks:
      - longnt

  php82:
    container_name: php82
    build:
      dockerfile: Dockerfile
      context: php82
#    entrypoint: /docker-entrypoint.sh
    volumes:
      - ./projects82:/var/www/projects82:delegated
      - ./composerCache82:/var/www/.composer:delegated
      - ./ssh/github:/.ssh/github
      - ./ssh/bitbucket:/.ssh/bitbucket
      - ./ssh/config:/.ssh/config
    working_dir: /var/www/projects82
    networks:
      - longnt

  php81:
    container_name: php81
    ports:
      - 5000:5000
      - 4242:4242
    build:
      dockerfile: Dockerfile
      context: php81
    volumes:
      - ./projects81:/var/www/projects81:delegated
      - ./composerCache81:/var/www/.composer:delegated
      - ./ssh/github:/.ssh/github
      - ./ssh/bitbucket:/.ssh/bitbucket
      - ./ssh/config:/.ssh/config
    working_dir: /var/www/projects81
    networks:
      - longnt

  mariadb:
    container_name: mariadb
    image: mariadb:10.6
    shm_size: 2gb
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./mariadb/db:/db:delegated
      - ./mariadb/conf:/etc/mysql/mariadb.conf.d:delegated
    restart: unless-stopped
    command: mysqld --sql_mode="" --innodb_ft_result_cache_limit=8000000000 --innodb_buffer_pool_size=5568435456 --max_allowed_packet=200000000 --innodb_strict_mode="OFF" --innodb_log_file_size=2503316480 --character-set-server=utf8 --collation-server=utf8_general_ci --innodb-flush-log-at-trx-commit=2 --optimizer_switch='rowid_filter=off' --optimizer_use_condition_selectivity=1
    networks:
      - longnt

#  opensearch12:
#    container_name: opensearch12
#    ports:
#      - 9201:9200
#      - 9600:9600
#    build:
#      dockerfile: Dockerfile
#      context: opensearch12
#    environment:
#      - cluster.name=opensearch-cluster
#      - node.name=opensearch-node1
