services:
  tls:
    container_name: tls
    image: nginx:1.22
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./tls/nginx.conf:/etc/nginx/nginx.conf
      - ./tls/ssl:/etc/ssl
    restart: unless-stopped
    networks:
      - longnt

  nginx:
    container_name: nginx
    image: nginx:1.22
    ports:
      - 8080:8080
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/sites:/etc/nginx/conf.d
