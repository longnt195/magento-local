map $http_host $MAGE_RUN_CODE_m245p10ee {
   au.m245p10ee.local '';
}

server {
    listen 80;
    listen 443 ssl;

    ssl_certificate      /etc/ssl/fullchain.pem;
    ssl_certificate_key  /etc/ssl/privkey.pem;

    server_name au.m245p10ee.test;

    set $MAGE_ROOT /var/www/projects81/m245p10ee;
    set $MAGE_MODE developer;
    set $MAGE_RUN_TYPE website;
    set $MAGE_RUN_CODE $MAGE_RUN_CODE_m245p10ee;

    include /var/www/projects81/nginx.conf;
}
