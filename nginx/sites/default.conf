map $http_host $MAGE_RUN_CODE_MIT {
   au.mit.test '';
   hh.mit.test homehardware;
   pk.mit.test principalkitchens;
}

server {
   server_name *.mit.test;

   set $MAGE_ROOT /var/www/projects83/mit;
   set $MAGE_RUN_TYPE store;
   set $MAGE_RUN_CODE $MAGE_RUN_CODE_MIT;

   include /var/www/projects83/nginx.conf;

   # OMS static app
   location /oms/ {
       root /var/www/projects83/mit/pub;
       index index.html;

       # Cache static assets for 1 year
       location ~* ^/oms/.*\.(css|js|map|hbs|gif|jpe?g|png|tiff|wbmp|ico|jng|bmp|svgz|midi?|mp?ga|mp2|mp3|m4a|ra|weba|3gpp?|mp4|mpe?g|mpe|ogv|mov|webm|flv|mng|asx|asf|wmv|avi|ogx|swf|jar|ttf|eot|woff|otf|html?)$ {
           expires 1y;
           access_log off;
           add_header Cache-Control "public";
           try_files $uri =404;
       }

       # Disable PHP/script execution
       location ~* ^/oms/.*\.(php|pl|py|jsp|asp|sh|cgi)$ {
           deny all;
       }

       # SPA fallback (passthru)
       try_files $uri $uri/ /oms/index.html;
   }
}

