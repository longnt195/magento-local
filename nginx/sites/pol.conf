map $http_host $MAGE_RUN_CODE_POL {
   au.pol.test '';
}

server {
    listen 80;
    listen 443 ssl;

    ssl_certificate      /etc/ssl/fullchain.pem;
    ssl_certificate_key  /etc/ssl/privkey.pem;

    server_name au.pol.test;

    set $MAGE_ROOT /var/www/projects82/pol;
    set $MAGE_RUN_TYPE website;
    set $MAGE_RUN_CODE $MAGE_RUN_CODE_POL;

    include /var/www/projects82/nginx.conf;
}
