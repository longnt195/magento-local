map $http_host $MAGE_RUN_CODE_KRI {
   au.kri.test '';
   nz.kri.test krispy_kreme_nz;
   aufun.kri.test krispykremeaufundraising;
   nzfun.kri.test krispykremenzfundraising;
}

server {
    listen 80;
    listen 443 ssl;

    ssl_certificate      /etc/ssl/fullchain.pem;
    ssl_certificate_key  /etc/ssl/privkey.pem;

    server_name au.kri.test nz.kri.test aufun.kri.test nzfun.kri.test;

    set $MAGE_ROOT /var/www/projects81/kri;
    set $MAGE_RUN_TYPE website;
    set $MAGE_RUN_CODE $MAGE_RUN_CODE_KRI;

    include /var/www/projects81/nginx.conf;
}
